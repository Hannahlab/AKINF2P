<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | AKINF2P</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="https://res.cloudinary.com/kfcu2z4r/image/upload/v1784216475/file_00000000eed471f491495382e79eea06_otmtrn.png" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="stylesheet" href="css/dashboard.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <section class="dashboard-page">
      <div class="dashboard-container" style="max-width: 440px">
        <h1>Reset Your Password</h1>
        <p class="dashboard-subtitle">Enter a new password for your account.</p>

        <div class="dashboard-card">
          <div id="resetInvalid" style="display: none">
            <p>This reset link is invalid or has expired. Request a new one from the login form.</p>
            <button class="gold-btn" onclick="window.location.href='index.html'">Go to homepage</button>
          </div>

          <div id="resetForm" style="display: none">
            <input type="password" id="newPassword" placeholder="New password" />
            <input type="password" id="confirmPassword" placeholder="Confirm new password" />
            <p class="auth-error" id="resetError"></p>
            <button class="gold-btn" id="resetSubmitBtn">Set New Password</button>
          </div>

          <div id="resetSuccess" style="display: none">
            <p>✅ Password updated! You can now log in with your new password.</p>
            <button class="gold-btn" onclick="window.location.href='index.html'">Go to homepage</button>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
      // Supabase puts the visitor into a temporary "recovery" session
      // when they arrive here via the emailed link — we just need to
      // wait for that session before showing the form.
      const invalidView = document.getElementById("resetInvalid");
      const formView = document.getElementById("resetForm");
      const successView = document.getElementById("resetSuccess");

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          formView.style.display = "block";
        }
      });

      // Fallback: if there's already a session (e.g. page refreshed
      // after the recovery event fired), show the form too.
      supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) {
          formView.style.display = "block";
        } else {
          setTimeout(() => {
            if (formView.style.display === "none") invalidView.style.display = "block";
          }, 2000);
        }
      });

      document.getElementById("resetSubmitBtn").addEventListener("click", async () => {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorEl = document.getElementById("resetError");
        errorEl.textContent = "";

        if (!newPassword || newPassword.length < 6) {
          errorEl.textContent = "Password must be at least 6 characters.";
          return;
        }

        if (newPassword !== confirmPassword) {
          errorEl.textContent = "Passwords don't match.";
          return;
        }

        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

        if (error) {
          errorEl.textContent = error.message;
          return;
        }

        formView.style.display = "none";
        successView.style.display = "block";
      });
    </script>
  </body>
</html>
